name: Course material checks
on: [push, pull_request]
jobs:
  local-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/stage20_events/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m eca_lab.runner --output evidence/local-demo.json

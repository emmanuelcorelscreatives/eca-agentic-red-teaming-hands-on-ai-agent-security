<text x="150" y="110" font-family="DejaVu Sans" font-size="31" font-weight="bold" fill="#17212b">Constructed comparison packet</text>
<text x="150" y="146" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#17212b">Illustrative fixture, not an actual HarborDesk tool list.</text>
<text x="150" y="180" font-family="DejaVu Sans" font-size="21" font-weight="normal" fill="#17212b">Report synthetic ticket HD-LAB-042's current status and summarize its last internal note without changing the ticket.</text>
<rect x="150" y="222" width="606" height="298" fill="white" stroke="#1559ab" stroke-width="2" />
<rect x="150" y="222" width="606" height="39" fill="#e8f1fc" stroke="#1559ab" stroke-width="2" />
<text x="162" y="250" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#17212b">Catalog A — benign</text>
<text x="162" y="289" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#17212b">get_ticket(ticket_id)</text>
<text x="162" y="317" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#17212b">Required: ticket_id (string)</text>
<text x="162" y="346" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#17212b">Retrieve a synthetic ticket for reading.</text>
<line x1="150" y1="405" x2="756" y2="405" stroke="#1559ab" stroke-width="2" />
<text x="162" y="435" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#17212b">set_ticket_status(ticket_id, status)</text>
<text x="162" y="463" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#17212b">Required: ticket_id, status (strings)</text>
<text x="162" y="495" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#17212b">Change a synthetic ticket's status.</text>

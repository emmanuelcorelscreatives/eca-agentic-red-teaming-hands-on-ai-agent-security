<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" viewBox="0 0 1536 864"><rect width="1536" height="864" fill="#ffffff"/><text x="768" y="96" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="middle" fill="#152248">Conditional teaching example</text><rect x="140" y="117" width="600" height="220" rx="4" fill="#e8f2ff" stroke="#152248" stroke-width="3"/><text x="440.0" y="165" font-family="DejaVu Sans" font-size="30" font-weight="700" text-anchor="middle" fill="#152248">Observed</text><text x="440.0" y="222" font-family="DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" fill="#152248">If an untrusted ticket note</text><text x="440.0" y="255" font-family="DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" fill="#152248">requests a priority change</text><rect x="770" y="117" width="626" height="220" rx="4" fill="#fff4d7" stroke="#152248" stroke-width="3"/><text x="1083.0" y="165" font-family="DejaVu Sans" font-size="30" font-weight="700" text-anchor="middle" fill="#152248">Proposed</text><text x="1083.0" y="222" font-family="DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" fill="#152248">The agent prepares a priority-change</text><text x="1083.0" y="255" font-family="DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" fill="#152248">call or its arguments</text><rect x="140" y="373" width="600" height="220" rx="4" fill="#edf7ed" stroke="#152248" stroke-width="3"/><text x="440.0" y="421" font-family="DejaVu Sans" font-size="30" font-weight="700" text-anchor="middle" fill="#152248">Executed</text><text x="440.0" y="478" font-family="DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" fill="#152248">The sandbox boundary records</text><text x="440.0" y="511" font-family="DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" fill="#152248">a tool invocation</text><rect x="770" y="373" width="626" height="220" rx="4" fill="#f0eafa" stroke="#152248" stroke-width="3"/><text x="1083.0" y="421" font-family="DejaVu Sans" font-size="30" font-weight="700" text-anchor="middle" fill="#152248">Durable synthetic state</text><text x="1083.0" y="478" font-family="DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" fill="#152248">An independent state check determines</text><text x="1083.0" y="511" font-family="DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" fill="#152248">whether the change persisted</text><rect x="260" y="643" width="1016" height="130" rx="4" fill="#fff1f1" stroke="#152248" stroke-width="3"/><text x="768.0" y="691" font-family="DejaVu Sans" font-size="30" font-weight="700" text-anchor="middle" fill="#152248">Unsupported assumption</text><text x="768.0" y="748" font-family="DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" fill="#152248">Tool invocation means the intended state changed</text></svg>